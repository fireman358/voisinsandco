name: Mise à jour des sociétés (OpenStreetMap)

on:
  push:
    branches:
      - main
      - vibe/wallonie-d05f19
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Import Overpass → seed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupère les commerces réels (OpenStreetMap / Overpass)
        run: node scripts/fetch-osm-pois.mjs

      - name: Régénère seed.sql + migration
        run: node scripts/generate-seed-sql.mjs

      - name: Commit les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/seed-data.json lib/demo-data.json lib/communes.json seed.sql
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
            exit 0
          fi
          git commit -m "chore: actualise les sociétés réelles depuis OpenStreetMap"
          git push
