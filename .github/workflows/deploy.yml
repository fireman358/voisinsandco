name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build + Deploy Voisins & Co
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (TypeScript + ESLint)
        run: npm run build

      # Les migrations et le seed D1 sont appliqués par le workflow quotidien
      # « D1 refresh » : le free tier D1 limite les écritures journalières et un
      # re-seed complet bloquerait chaque déploiement.

      - name: Deploy to Cloudflare Workers (OpenNext)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
