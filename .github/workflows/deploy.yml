name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build + Deploy Voisins & Co
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (TypeScript + ESLint)
        run: npm run build

      - name: Provision D1 database + migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          DB_ID="$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const f=l.find(d=>d.name==='voisins-and-co-db');console.log(f?f.uuid:'')})")"
          if [ -z "$DB_ID" ]; then
            OUT="$(npx wrangler d1 create voisins-and-co-db)"
            DB_ID="$(echo "$OUT" | grep -o 'database_id = "[^"]*"' | head -1 | cut -d'"' -f4)"
          fi
          echo "D1 database_id: ${DB_ID:0:8}…"
          sed -i "s/REMPLACER-PAR-L-ID-D1/$DB_ID/" wrangler.jsonc
          npx wrangler d1 migrations apply voisins-and-co-db --remote
          npx wrangler d1 execute voisins-and-co-db --remote --file=seed.sql

      - name: Deploy to Cloudflare Workers (OpenNext)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
