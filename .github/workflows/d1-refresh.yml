name: D1 refresh (migrations + seed OSM)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d1-refresh.yml"
      - "migrations/**"
      - "seed.sql"
  schedule:
    # 03:00 UTC : la limite d'écritures journalières D1 (free tier) est
    # réinitialisée à minuit UTC, on laisse une marge.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Migrations + seed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Applique les migrations D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply voisins-and-co-db --remote

      - name: Applique le seed si modifié ces 26 dernières heures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if git log --since="26 hours ago" --oneline -- seed.sql | grep -q .; then
            npx wrangler d1 execute voisins-and-co-db --remote --file=seed.sql
          else
            echo "seed.sql inchangé — rien à appliquer."
          fi
